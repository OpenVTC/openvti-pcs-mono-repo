# did-hosting-daemon recipe (`did-hosting-daemon setup --from`), self-managed:
# the daemon mints and hosts its own did:webvh, no VTA involved. Derived from
# affinidi-webvh-service examples/did-hosting-daemon-self-managed.toml.
#
# Its DID becomes did:webvh:<scid>:localhost%3A8534. The research VTA registers
# it as its WebVH hosting server (persona DIDs for OpenVTC clients are
# published here), and is given an `owner` ACL entry on it by bootstrap.sh.

[deployment]
service = "daemon"
vta_mode = "self-managed"

[output]
config_path = "config.toml"

[server]
host = "0.0.0.0"
port = 8534
log_level = "info"
log_format = "text"
data_dir = "data"

[identity]
public_url = "http://localhost:8534"

[daemon]
enable_control = true
enable_server  = true
enable_witness = true
enable_watcher = false

[secrets]
# Clear-text key file beside config.toml. Local playground only.
backend = "plaintext"
confirm_plaintext = true

[admin]
mode = "skip"

[reprovision]
force = false
